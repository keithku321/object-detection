[pytest]
# Put the repository root on sys.path so tests can import common, underwater, weather, smallobject and camoedge
pythonpath = .
testpaths = tests
# Marker for tests that need a GPU or a network download; skipped unless selected with -m
markers =
    slow: needs Ultralytics weights, a GPU or a network download (run with: pytest -m slow)
addopts = -m "not slow"
